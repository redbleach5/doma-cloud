# Doma Cloud E2E — Playwright (chromium) against a real dev server.
#
# Kept out of the main CI workflow because it is comparatively slow
# (browser download + `next dev` boot) and the e2e scenarios are API-level
# smoke tests; unit + integration CI already guard every push.
#
# Runs: weekly (Mon 03:00 UTC) and on demand (workflow_dispatch).
# The dev server starts without a `.env` file — all required variables
# come from the job `env` block below.
name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway DB + storage for the `next dev` server started by
      # playwright.config.ts webServer (command: bun run dev).
      DATABASE_URL: file:./prisma/e2e.db
      STORAGE_LOCAL_ROOT: ./storage-data-e2e
      DOMA_JWT_SECRET: e2e-ci-secret-0123456789abcdef0123456789abcdef
      DOMA_INSECURE_COOKIE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Prepare e2e database
        run: bunx prisma db push --schema=prisma/schema.prisma

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7