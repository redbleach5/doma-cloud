# Doma Cloud CI — lint, typecheck, unit + integration tests, production build.
#
# Prisma client is NOT generated by `bun install` (no postinstall script),
# so every job that imports app code runs `bun run db:generate` explicitly.
#
# E2E (Playwright) lives in a separate workflow (e2e.yml) — it is slower
# (browser download + dev server) and runs on schedule / on demand.
name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the version used locally (bun --version). Bump together with
  # local Bun to keep CI and dev environments identical.
  BUN_VERSION: "1.4.0"

jobs:
  lint-and-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck (app)
        run: bun run typecheck

      - name: Typecheck (tests)
        run: bun run typecheck:test

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Run unit tests
        run: bun run test:unit

  integration-tests:
    name: Integration tests (SQLite + API routes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No DATABASE_URL needed here: `test:setup` computes an absolute path
    # itself (relative SQLite URLs are resolved against the schema dir —
    # that mismatch once produced an empty test DB on CI), and
    # tests/preload.ts overrides DATABASE_URL with the same absolute path
    # for the tests.
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      # Creates prisma/test.db (DATABASE_URL is overridden by tests/preload.ts).
      - name: Prepare test database
        run: bun run test:setup

      - name: Run integration tests
        run: bun run test:integration

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint-and-typecheck, unit-tests, integration-tests]
    env:
      # next build sets NODE_ENV=production; getSecret() would throw without
      # a real secret, and prerendering may touch the database — give the
      # build a throwaway DB so it never depends on developer-local state.
      DATABASE_URL: file:./prisma/ci.db
      DOMA_JWT_SECRET: ci-build-secret-0123456789abcdef0123456789abcdef
      DOMA_INSECURE_COOKIE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Create throwaway database for build
        run: bunx prisma db push --schema=prisma/schema.prisma

      - name: Build
        run: bun run build